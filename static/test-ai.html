<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>AI老师测试</title>
<style>
body { font-family: sans-serif; max-width: 800px; margin: 50px auto; padding: 20px; }
button { padding: 12px 24px; font-size: 14px; cursor: pointer; background: #3B82F6; color: white; border: none; border-radius: 6px; }
button:hover { background: #2563EB; }
#output { margin-top: 20px; padding: 20px; background: #F8FAFC; border-radius: 8px; line-height: 1.8; min-height: 200px; white-space: pre-wrap; }
.loading { color: #94A3B8; text-align: center; padding: 40px; }
</style>
</head>
<body>
<h1>🤖 AI老师讲解测试</h1>
<button onclick="testAI()">点击测试 AI 讲解</button>
<div id="output" class="loading">点击按钮开始测试...</div>

<script>
async function testAI() {
  const output = document.getElementById('output');
  output.className = 'loading';
  output.textContent = '⏳ AI老师正在生成讲解内容...';

  try {
    const stock = {
      name: '双均线趋势跟踪',
      code: 'STRATEGY',
      reasons: '入场：5日和20日均线金叉 | 出场：死叉或止损 | 止损：跌破8%'
    };
    const risk = {code: 'C1', lv: '投资新手'};

    const resp = await fetch('/api/llm/explain', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({stock, risk, mode: 'pick'})
    });

    if (!resp.ok) {
      output.textContent = `❌ 请求失败: ${resp.status} ${resp.statusText}`;
      return;
    }

    output.className = '';
    output.textContent = '';

    const reader = resp.body.getReader();
    const decoder = new TextDecoder();
    let fullText = '';

    while(true) {
      const {done, value} = await reader.read();
      if(done) break;

      const chunk = decoder.decode(value, {stream: true});
      const lines = chunk.split('\n');

      for(const line of lines) {
        if(!line.startsWith('data: ')) continue;
        try {
          const data = JSON.parse(line.slice(6));
          if(data.t) {
            fullText += data.t;
            output.textContent = fullText;
          }
          if(data.error) {
            output.textContent = '❌ AI服务错误: ' + data.error;
            return;
          }
          if(data.done) {
            output.textContent = fullText + '\n\n✅ 完成';
            return;
          }
        } catch(e) {
          console.error('解析失败:', e, line);
        }
      }
    }

  } catch(e) {
    output.textContent = `❌ 错误: ${e.message}`;
    console.error(e);
  }
}
</script>
</body>
</html>
