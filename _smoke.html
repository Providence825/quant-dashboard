<script>
window.addEventListener("error",function(e){document.title="JSERR:"+e.message;});
fetch("http://127.0.0.1:5000/huitoudun.html").then(r=>r.text()).then(html=>{

  var need=["function toggleStk","function streamDeepReading","function probeLLM","DeepSeek 实时生成","air-live"];

});
