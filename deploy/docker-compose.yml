version: '3.8'

services:
  shoutouzhe:
    build: ..
    container_name: shoutouzhe
    ports:
      - "5000:5000"
    env_file:
      - ../.env
    volumes:
      - ../data:/app/data  # 持久化数据库
      - ../logs:/app/logs  # 持久化日志
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/api/llm/status"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  nginx:
    image: nginx:alpine
    container_name: shoutouzhe-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ../static:/usr/share/nginx/html/static:ro
      - ./ssl:/etc/nginx/ssl:ro  # SSL 证书目录（可选）
    depends_on:
      - shoutouzhe
    restart: unless-stopped
